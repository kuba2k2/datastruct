[tool.poetry]
name = "py-datastruct"
version = "2.0.0"
description = "Combination of struct and dataclasses for easy parsing of binary formats"
authors = ["Kuba Szczodrzyński <kuba@szczodrzynski.pl>"]
license = "MIT"
readme = "README.md"
packages = [
    { include = "datastruct" },
]

[tool.poetry.dependencies]
python = "^3.8"

[tool.poetry.group.dev.dependencies]
black = {version = "^26.10.1", markers = "python_version >= '3.10'"}
isort = {version = "^9.0.2", markers = "python_version >= '3.10'"}
autoflake = {version = "^2.4.0", markers = "python_version >= '3.10'"}

[tool.poetry.group.test.dependencies]
pytest = "^8.3.3"
macaddress = "^2.0.2"
pycryptodome = "^3.21.0"
requests = "^2.32.3"
bitstruct = "^8.19.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
